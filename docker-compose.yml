version: '3.8'

services:
  evently-api:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=evently_db
      - PGUSER=evently_user
      - PGPASSWORD=evently_password
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - TERMII_API_KEY=${TERMII_API_KEY}
      - TERMII_SENDER_ID=${TERMII_SENDER_ID:-Evently}
      - TERMII_CHANNEL=${TERMII_CHANNEL:-generic}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}      - CORS_ORIGIN=*
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - evently-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=evently_db
      - POSTGRES_USER=evently_user
      - POSTGRES_PASSWORD=evently_password
    ports:
      # 5432 is taken by the locally installed PostgreSQL
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - evently-network

volumes:
  postgres_data:

networks:
  evently-network:
    driver: bridge